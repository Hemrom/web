<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .cls-1 { fill: #0ea5e9; }
      .cls-2 { fill: #ffffff; }
      .cls-3 { fill: #0284c7; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" class="cls-1"/>
  
  <!-- Graduation cap -->
  <g transform="translate(4, 6)">
    <!-- Cap base -->
    <rect x="4" y="12" width="16" height="3" rx="1" class="cls-2"/>
    <!-- Cap top -->
    <polygon points="2,12 22,12 20,8 4,8" class="cls-2"/>
    <!-- Tassel -->
    <circle cx="20" cy="10" r="1" class="cls-3"/>
    <line x1="20" y1="11" x2="20" y2="16" stroke="#0284c7" stroke-width="1"/>
    <circle cx="20" cy="16" r="1.5" class="cls-3"/>
  </g>
  
  <!-- School text "SMK" -->
  <text x="16" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" class="cls-2">SMK</text>
</svg>